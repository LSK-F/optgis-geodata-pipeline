[project]
name = "optgis-geodata-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "shapely>=2.1.2",
]

[project.scripts]
optgis-geodata-pipeline = "optgis_geodata_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
